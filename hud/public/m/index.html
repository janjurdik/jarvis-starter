<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#04070a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jarvis</title>
  <link rel="manifest" href="/m/manifest.json">
  <link rel="icon" href="/m/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/m/apple-touch-icon.png">
  <link rel="preload" href="/fonts/mona-sans-vf.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/m/m.css">
  <script type="module" src="/m/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path class="r" d="M22.95 3.26A17 17 0 0 1 35.97 25.81M33.02 30.93A17 17 0 0 1 6.98 30.93M4.03 25.81A17 17 0 0 1 17.05 3.26"/><circle class="d" cx="20" cy="20" r="10.5"/><circle class="c" cx="20" cy="20" r="4.8"/></svg>
      </span>
      <div class="who"><b id="name">Jarvis</b><span id="state">Pripájam sa…</span></div>
      <button type="button" class="icon-btn" id="menu-btn" aria-label="Ponuka" aria-expanded="false" aria-controls="menu">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><g class="ic-l"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></g></svg>
      </button>
      <nav class="menu" id="menu" hidden>
        <a href="/?hud=1" id="full"></a>
        <button type="button" id="logout"></button>
        <small>Kým máte Jarvisa otvoreného tu, hovorí v mobile a počítač mlčí.</small>
      </nav>
    </header>
    <section class="jobs" id="jobs" aria-label="Úlohy na pozadí" hidden></section>
    <main class="feed" id="feed"><div class="feed-in" id="feed-in" aria-live="polite"></div></main>
    <footer class="dock">
      <div class="busy" id="busy" hidden><button type="button" class="btn" id="stop"></button></div>
      <div class="dock-in">
        <form class="bar" id="bar">
          <textarea id="text" rows="1" maxlength="4000" placeholder="Napíšte Jarvisovi…" enterkeyhint="send" autocomplete="off"></textarea>
          <button type="submit" class="send" id="send" aria-label="Poslať" disabled></button>
        </form>
        <button type="button" class="talk" id="talk" aria-label="Podržte a hovorte"></button>
      </div>
    </footer>
  </div>
  <div class="hint" id="hint" role="status" hidden></div>
</body>
</html>
