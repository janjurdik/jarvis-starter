<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04070a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jarvis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2304070a'/%3E%3Cpath d='M22.95 3.26A17 17 0 0 1 35.97 25.81M33.02 30.93A17 17 0 0 1 6.98 30.93M4.03 25.81A17 17 0 0 1 17.05 3.26' fill='none' stroke='%237ff3ff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='20' r='10' fill='none' stroke='%237ff3ff' stroke-width='1.6' stroke-dasharray='1.5 3'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23eafbff'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/fonts/jetbrains-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/hud.css">
  <link rel="stylesheet" href="/css/import.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
  <script type="module" src="/js/main.js"></script>
</head>
<body class="is-loading">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="atmo" aria-hidden="true"></div>
  <div id="labels"></div>

  <div class="stage" id="stage">
    <header class="top" id="top">
      <div class="brand" aria-label="Jarvis">
        <button type="button" class="fold fold-l" id="fold-l" aria-label="Dnes a rutiny" aria-expanded="false" aria-controls="pane-l"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg></button>
        <span class="brand-mark" aria-hidden="true">
          <svg class="bm-base" viewBox="0 0 40 40"><circle class="bm-d" cx="20" cy="20" r="17"/><circle class="bm-l" cx="20" cy="20" r="4.8"/></svg>
          <svg class="bm-arcs" viewBox="0 0 40 40"><path class="bm-s" d="M22.95 3.26A17 17 0 0 1 35.97 25.81M33.02 30.93A17 17 0 0 1 6.98 30.93M4.03 25.81A17 17 0 0 1 17.05 3.26"/></svg>
          <svg class="bm-in" viewBox="0 0 40 40"><circle class="bm-s" cx="20" cy="20" r="10.5" stroke-dasharray="1.6 3.1"/></svg>
        </span>
        <svg class="brand-word" viewBox="-1.5 -1.5 105 23" aria-hidden="true">
          <path class="bw" stroke-width="2.5" d="M8.5 0v13.2a6.8 6.8 0 0 1-6.8 6.8H0M15.5 20 24 0l8.5 20M39.5 20V.9h7.1a5.4 5.4 0 0 1 0 10.8h-7.1M45.6 11.7 52 20M58.5 0 67 20l8.5-20M82 0v20M100.6 3.1C99.2 1.1 97.1 0 94.6 0c-3.3 0-5.7 2-5.7 4.9 0 6.6 12.4 3.6 12.4 10.2 0 2.9-2.4 4.9-6.1 4.9-2.7 0-5-1.1-6.5-3.2"/>
          <path class="bw-l" d="m24 11.4 2.5 4.9h-5Z"/>
        </svg>
      </div>
      <div class="chips" id="chips"></div>
      <div class="clock" aria-label="Čas">
        <button type="button" class="fold fold-r" id="fold-r" aria-label="Rozhovor a pamäť" aria-expanded="false" aria-controls="pane-r"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12a2.5 2.5 0 0 1 2.5 2.5v6A2.5 2.5 0 0 1 18 16h-5.4L8 19.6V16H6a2.5 2.5 0 0 1-2.5-2.5v-6A2.5 2.5 0 0 1 6 5Z"/></svg></button>
        <div class="clock-main"><span class="clock-hm" id="clock-hm">--:--</span><span class="clock-s" id="clock-s">00</span></div>
        <div class="clock-date" id="clock-date"></div>
      </div>
    </header>

    <aside class="pane pane-l" id="pane-l">
      <div class="pane-in">
        <i class="pane-run" aria-hidden="true"></i>
        <div class="pane-scroll" id="scroll-l">
        <section class="mod mod-today" id="mod-today">
          <h2 class="mh">Dnes</h2>
          <div class="today-top">
            <div class="hero-hm" id="hero-hm">--:--</div>
            <div class="wx-art" id="wx-art"></div>
            <div class="today-date" id="today-date"></div>
            <div class="wx-meta"><span class="wx-temp" id="wx-temp"></span><span class="wx-text" id="wx-text"></span></div>
          </div>
          <div class="sleep" id="sleep"></div>
          <ol class="agenda" id="agenda"></ol>
          <div class="today-foot" id="today-foot"></div>
        </section>
        <section class="mod mod-routines" id="mod-routines">
          <h2 class="mh">Rutiny</h2>
          <ol class="tl" id="routines"></ol>
        </section>
        </div>
      </div>
    </aside>

    <aside class="pane pane-r" id="pane-r">
      <div class="pane-in">
        <i class="pane-run" aria-hidden="true"></i>
        <div class="pane-scroll" id="scroll-r">
        <section class="mod mod-chat" id="mod-chat">
          <h2 class="mh">Rozhovor</h2>
          <div class="chat-view" id="chat-view"><ol class="chat" id="chat"></ol></div>
          <div class="chat-empty" id="chat-empty" hidden></div>
        </section>
        <section class="mod mod-imports" id="mod-imports" hidden>
          <h2 class="mh">Importy</h2>
          <ol class="jobs" id="imports"></ol>
        </section>
        <section class="mod mod-jobs" id="mod-jobs" hidden>
          <h2 class="mh">Úlohy</h2>
          <ol class="jobs" id="jobs"></ol>
          <div class="jobs-more" id="jobs-more"></div>
        </section>
        <section class="mod mod-memory" id="mod-memory">
          <img class="mem-holo" src="/img/holo/fotky.png" alt="" decoding="async">
          <h2 class="mh">Pamäť</h2>
          <div class="mem-hero"><span class="mem-big" id="mem-total">–</span><span class="mem-unit" id="mem-unit">poznámok</span></div>
          <ul class="mem-src" id="mem-src"></ul>
          <div class="mem-more" id="mem-more"></div>
          <button type="button" class="mem-import" id="mem-import" hidden></button>
        </section>
        <section class="mod mod-log" id="mod-log">
          <h2 class="mh">Log</h2>
          <ol class="log" id="log"></ol>
        </section>
        </div>
      </div>
    </aside>
  </div>

  <footer class="voice" id="voice">
    <p class="subtitle" id="subtitle"></p>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
    <div class="tray" id="tray" hidden></div>
    <form class="cmd" id="cmd" autocomplete="off">
      <button type="button" class="orb" id="orb" aria-label="Hovoriť s Jarvisom">
        <svg class="orb-seg" viewBox="0 0 48 48" aria-hidden="true"><path class="o-seg" d="M33.75 7.11A19.5 19.5 0 0 1 33.75 40.89M14.25 40.89A19.5 19.5 0 0 1 14.25 7.11"/></svg>
        <svg class="orb-main" viewBox="0 0 48 48" aria-hidden="true">
          <circle class="o-wave" cx="24" cy="24" r="22"/>
          <circle class="o-wave" cx="24" cy="24" r="22"/>
          <circle class="o-ring" cx="24" cy="24" r="22.5"/>
          <circle class="o-core" cx="24" cy="24" r="14.5"/>
          <g class="o-mic"></g>
        </svg>
      </button>
      <div class="cmd-field">
        <input class="cmd-input" id="cmd-input" type="text" placeholder="Povedz Jarvisovi…" spellcheck="false" enterkeyhint="send" aria-label="Správa pre Jarvisa">
        <div class="cmd-hint" id="cmd-hint" aria-hidden="true"></div>
        <canvas class="cmd-wave" id="cmd-wave" aria-hidden="true"></canvas>
        <div class="cmd-live" id="cmd-live"></div>
      </div>
      <button type="button" class="cmd-clip" id="cmd-clip" aria-label="Pridať fotku alebo súbor" title="Pridať fotku alebo súbor"></button>
      <input type="file" id="file-input" multiple hidden>
      <div class="keys" id="keys"></div>
    </form>
  </footer>

  <div class="pv" id="people" role="dialog" aria-label="Ľudia z importu" hidden></div>
  <div class="pv jv" id="job-view" role="dialog" aria-label="Úloha" hidden></div>
  <div class="drop" id="dropzone" aria-hidden="true" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="grain" aria-hidden="true"></div>

  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="wx-cloud-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7ff3ff" stop-opacity=".3"/>
        <stop offset="1" stop-color="#7ff3ff" stop-opacity=".04"/>
      </linearGradient>
      <radialGradient id="wx-sun-fill" cx=".4" cy=".38" r=".7">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
        <stop offset=".45" stop-color="#bff8ff" stop-opacity=".55"/>
        <stop offset="1" stop-color="#7ff3ff" stop-opacity=".12"/>
      </radialGradient>
      <radialGradient id="wx-moon-fill" cx=".32" cy=".6" r=".8">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".8"/>
        <stop offset=".55" stop-color="#9ff6ff" stop-opacity=".3"/>
        <stop offset="1" stop-color="#7ff3ff" stop-opacity=".06"/>
      </radialGradient>
      <radialGradient id="orb-core" cx=".42" cy=".36" r=".72">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".45" stop-color="#a6f7ff"/>
        <stop offset="1" stop-color="#36cde9"/>
      </radialGradient>
    </defs>
  </svg>
</body>
</html>
