<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04070a">
  <title>Jarvis · Tvoje appky</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2304070a'/%3E%3Cpath d='M22.95 3.26A17 17 0 0 1 35.97 25.81M33.02 30.93A17 17 0 0 1 6.98 30.93M4.03 25.81A17 17 0 0 1 17.05 3.26' fill='none' stroke='%237ff3ff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='20' r='10' fill='none' stroke='%237ff3ff' stroke-width='1.6' stroke-dasharray='1.5 3'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23eafbff'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-tight-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/apps/apps.css">
  <script type="module" src="/apps/apps.js"></script>
</head>
<body>
  <canvas class="sky" id="sky" aria-hidden="true"></canvas>
  <svg class="defs" aria-hidden="true" focusable="false">
    <filter id="liquid" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence id="liquid-noise" type="fractalNoise" baseFrequency="0.018 0.026" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap id="liquid-map" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <header class="top">
    <a class="brand" href="/" aria-label="Späť na plochu Jarvisa">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-opacity=".18"/>
        <path d="M22.95 3.26A17 17 0 0 1 35.97 25.81M33.02 30.93A17 17 0 0 1 6.98 30.93M4.03 25.81A17 17 0 0 1 17.05 3.26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="4.8" fill="#eafbff"/>
      </svg>
      <span>Jarvis</span>
    </a>
    <nav class="steps" id="steps" aria-label="Kroky">
      <button type="button" data-step="0"><i>1</i>Appky</button>
      <button type="button" data-step="1"><i>2</i>S čím pomôžem</button>
      <button type="button" data-step="2"><i>3</i>Napojenie</button>
    </nav>
    <a class="back" href="/">Späť na plochu</a>
  </header>

  <main id="app" tabindex="-1">
    <p class="boot">Chvíľu…</p>
  </main>

  <footer class="dock" id="dock" hidden>
    <div class="dock-in">
      <div class="dock-icons" id="dock-icons" aria-hidden="true"></div>
      <p class="dock-text" id="dock-text"></p>
      <button type="button" class="btn ghost" id="dock-back" hidden>Späť</button>
      <button type="button" class="btn" id="dock-next">Ďalej</button>
    </div>
  </footer>

  <noscript><p class="boot">Stránka potrebuje zapnutý JavaScript.</p></noscript>
</body>
</html>
